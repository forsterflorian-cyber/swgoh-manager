name: SWGOH weekly roster snapshot

on:
  push:
    paths:
      - '.github/workflows/swgoh-weekly.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 5'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Launch independent SWGOH Comlink
        run: |
          docker run -d --name comlink -p 127.0.0.1:3000:3000 \
            -e APP_NAME=swgoh-weekly-snapshot \
            -e PORT=3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate both accounts
        run: node scripts/swgoh-weekly-snapshot.mjs
      - name: Collect public GAC history
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/swgoh-gac-history.mjs
      - name: Publish dated and latest snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/swgoh-weekly
          if ! git diff --cached --quiet; then
            git commit -m "Update verified SWGOH snapshots"
            git push
          fi
      - name: Show logs if collection fails
        if: failure()
        run: docker logs --tail 120 comlink || true

# Recheck roster after in-game upgrades.
